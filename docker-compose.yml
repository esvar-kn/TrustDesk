# Full local stack: MongoDB + API server + client (nginx).
#
#   docker compose up -d                                    # build + start everything
#
#   # First-time setup (production-safe, non-destructive, idempotent):
#   docker compose run --rm server npm run load-reference   # KB + tool catalog
#   docker compose run --rm server npm run ensure-admin      # first manager (needs ADMIN_* in .env)
#   # then log in and create the rest of the staff via the Users Admin UI.
#
#   open http://localhost:8080                              # the app (nginx proxies /api → server)
#   docker compose down                                     # stop (data persists in the volume)
#   docker compose down -v                                  # stop and wipe the data volume
#
#   # Optional demo data (tickets/customers/demo users) for a populated walkthrough.
#   # DESTRUCTIVE: wipes every collection, and refused under NODE_ENV=production
#   # unless forced — use only on a throwaway/demo stack:
#   docker compose run --rm -e NODE_ENV=development server npm run seed
#
# Secrets are read from the repo-root .env (copy from .env.example first).
# AUTH_JWT_SECRET is required — the server fails fast without it in production.
# ADMIN_USERNAME / ADMIN_PASSWORD back the ensure-admin bootstrap above.

services:
  mongo:
    image: mongo:8
    container_name: trustdesk-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 })']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: trustdesk-server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/trustdesk
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env}
      DEMO_AGENT_PASSWORD: ${DEMO_AGENT_PASSWORD:-}
      DEMO_MANAGER_PASSWORD: ${DEMO_MANAGER_PASSWORD:-}
      DEMO_AUDITOR_PASSWORD: ${DEMO_AUDITOR_PASSWORD:-}
      # Bootstrap manager for `npm run ensure-admin` (non-destructive first login).
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    build:
      context: ./client
    container_name: trustdesk-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '8080:80'

volumes:
  mongo-data:
